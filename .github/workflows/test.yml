name: Tests

on:
    push:
        branches: [main, develop]
        paths:
            - "fig_scripts/**"
            - "tests/**"
            - ".github/workflows/test.yml"
    pull_request:
        paths:
            - "fig_scripts/**"
            - "tests/**"
            - ".github/workflows/test.yml"

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v8.2.0

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Run pytest
              working-directory: fig_scripts/pmg-api-usage-dependent-dependency/api-analyzer
              run: |
                  uv sync
                  uv run --isolated pytest --noconftest tests

            - name: Test figure data
              run: uv run --no-project --with pytest --with pandas --with plotly --with pyyaml python -m pytest tests
