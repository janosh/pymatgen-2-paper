default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.83
    hooks:
      - id: ty
        # Isolate dependency resolution from local environments and user uv indexes.
        args: [--isolated, --no-config]
        env: { UV_FROZEN: "0", UV_NO_SYNC: "0" }

  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        stages: [pre-commit, commit-msg]
        exclude_types: [bib, svg, json]
        exclude: pyproject.toml
        args:
          [
            --check-filenames,
            --ignore-words-list,
            "atomate,ElemNet,dscribe,basf,vise,HAppend",
          ]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        # MD013: line too long
        # MD033: no inline HTML
        # MD041: first line in a file should be a top-level heading
        args: [--disable, MD013, MD033, MD041, "--"]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: [--drop-empty-cells, --keep-output]

  - repo: local
    hooks:
      - id: validate-typst
        name: Validate Typst files compile without errors
        language: system
        # typst check command tracked in https://github.com/typst/typst/issues/3792
        entry: bash -c 'for x in "$@"; do typst compile "$x" - > /dev/null || exit 255; done' --
        files: \.typ$
        types: [file]

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.2
    hooks:
      - id: typos
        types: [text]
        exclude: ^fig_scripts/.+/.+\.csv$|^fig_scripts/pr_topics_over_time/_prs\.json$
        exclude_types: [svg, bib]
